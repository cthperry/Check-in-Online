name: 出勤系統驗證
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app.py attendance tests
      - run: node --check static/app.js
      - run: python -m unittest discover -s tests -v
      - name: 驗證正式服務啟動
        run: |
          python app.py serve &
          trap 'kill $!' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/ -o /dev/null
